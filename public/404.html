<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for GitHub Pages: encode the requested path as a query
      // parameter and redirect to the root so React Router can handle it.
      var l = window.location;
      l.replace(
        l.origin + '/?path=' + encodeURIComponent(l.pathname + l.search) + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
